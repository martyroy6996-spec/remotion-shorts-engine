<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1">
  <title>Reel Factory 3D Overlay</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 1080px;
      height: 1920px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent !important;
    }
    #root, #stage {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: transparent;
    }
    #scene {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      display: block;
      background: transparent;
    }
    #topic {
      position: absolute;
      top: 390px;
      left: 72px;
      max-width: 520px;
      padding: 17px 23px 19px;
      border-left: 6px solid #5bd8ff;
      background: linear-gradient(100deg, rgba(3, 9, 18, 0.82), rgba(3, 9, 18, 0.06));
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 35px;
      line-height: 1.02;
      font-weight: 900;
      letter-spacing: -1.1px;
      text-transform: uppercase;
      text-shadow: 0 4px 18px rgba(0,0,0,0.8);
      opacity: 0;
      transform: translateX(-28px);
    }
    #eyebrow {
      display: block;
      margin-bottom: 9px;
      color: #7de3ff;
      font-size: 17px;
      line-height: 1;
      letter-spacing: 4px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="root" data-start="0" data-width="1080" data-height="1920">
    <div id="stage" class="clip" data-start="0" data-duration="__DURATION__" data-track-index="0">
      <canvas id="scene" width="1080" height="1920"></canvas>
      <div id="topic">
        <span id="eyebrow">THE MOMENT</span>
        __TITLE__
      </div>
    </div>
  </div>
  <script src="./gsap.min.js"></script>
  <script type="module" src="./scene.bundle.js"></script>
</body>
</html>
